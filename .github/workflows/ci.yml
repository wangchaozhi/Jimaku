name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          ref='${{ github.ref_name }}'
          if [[ $ref =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then v=${BASH_REMATCH[1]}; else v=0.0.0; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtversion: '==3.3.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        # 只出 Apple 芯片版本：whisper.cpp 的 Metal 加速只对 Apple 芯片有意义
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DJIMAKU_VERSION=${{ steps.ver.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Import signing certificate
        # 固定的自签名证书：签名身份不变，升级后钥匙串里的"始终允许"仍然有效（同 SnapPin）。
        # 没有配置 secrets（如 fork 仓库）时跳过，退回 ad-hoc 签名
        if: startsWith(github.ref, 'refs/tags/v')
        id: sign
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "未配置签名证书，使用 ad-hoc 签名"; echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"
          # 用证书的 SHA-1 指纹签名：不依赖证书叫什么名字
          id=$(security find-identity "$kc" | awk '$2 ~ /^[0-9A-F]{40}$/ {print $2; exit}')
          if [ -z "$id" ]; then echo "::error::导入的 p12 里没有可用的签名身份"; exit 1; fi
          echo "identity=$id" >> "$GITHUB_OUTPUT"

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v='${{ steps.ver.outputs.version }}'
          macdeployqt build/Jimaku.app
          # 不是苹果开发者证书，首次打开仍需在“隐私与安全性”里允许
          codesign --force --deep --sign "${{ steps.sign.outputs.identity }}" build/Jimaku.app
          codesign -d -r- build/Jimaku.app
          ditto -c -k --keepParent build/Jimaku.app "Jimaku-$v-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: macos
          path: Jimaku-*-macos-arm64.zip

  windows:
    runs-on: windows-latest
    env:
      # 识别用 Vulkan 加速（NVIDIA / AMD / Intel 显卡都行，找不到显卡时自动用 CPU）
      VULKAN_VERSION: '1.4.363.0'
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $v = if ($ref -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          # Qt 6.11.3 起 Windows 仓库按编译器拆分，aqtinstall 3.3.0 找不到；先固定到已支持的提交（同 SnapPin）
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = $env:VULKAN_VERSION
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile vulkansdk.exe
          $p = Start-Process ./vulkansdk.exe -ArgumentList '--root', "C:\VulkanSDK\$ver", '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed: $($p.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH

      - name: Configure
        # 加引号：pwsh 会把未加引号的 -DX=0.1.0 在点号处拆开
        run: cmake -S . -B build -A x64 -DJIMAKU_VULKAN=ON "-DJIMAKU_VERSION=${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = 'dist/Jimaku'
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/Release/Jimaku.exe $dir
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$dir/Jimaku.exe"
          # 直接附带 VC++ 运行库，免去用户安装 vc_redist
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\*.dll" | Copy-Item -Destination $dir
          # 附带 LGPL 版 ffmpeg / ffprobe（程序会先在自己的目录里找）
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Get-ChildItem ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination $dir
          # 附带 Vulkan loader（vulkan-1.dll，Apache-2.0）：没装 Vulkan 运行库的电脑也能启动（这时用 CPU 识别）
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanRT-X64-$env:VULKAN_VERSION-Components.zip" -OutFile vulkanrt.zip
          Expand-Archive vulkanrt.zip -DestinationPath vulkanrt
          $loader = Get-ChildItem vulkanrt -Recurse -Filter vulkan-1.dll | Sort-Object { $_.FullName -notmatch 'x64' } | Select-Object -First 1
          if (-not $loader) { throw 'vulkan-1.dll not found in Vulkan runtime components' }
          Copy-Item $loader.FullName $dir
          Compress-Archive -Path $dir -DestinationPath "Jimaku-$v-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows
          path: Jimaku-*-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Jimaku-*.zip
          generate_release_notes: true
